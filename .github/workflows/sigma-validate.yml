name: Validate Sigma rules

on:
  push:
    paths:
      - "rules/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "dist/**"
      - "behavioral-keys.yml"
      - ".github/workflows/sigma-validate.yml"
  pull_request:
    paths:
      - "rules/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "dist/**"
      - "behavioral-keys.yml"
  workflow_dispatch:

jobs:
  rules:
    name: rules, tests, generated docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned toolchain
        run: pip install -r requirements-dev.txt

      - name: Validate all rules (sigma check)
        run: sigma check rules/

      - name: Run rule logic tests (true-positive / benign events)
        run: python3 tests/run_tests.py

      - name: Fidelity gate (no alert-tier bare high-volume rules) + regen behavioral
        run: python3 scripts/build_behavioral.py

      - name: Verify generated artifacts are in sync
        run: |
          python3 scripts/build_docs.py
          python3 scripts/build_navigator.py
          python3 scripts/build_scorecard.py
          python3 scripts/build_catalog.py
          if ! git diff --quiet -- cheatsheet docs detections.json behavioral-keys.yml dist/behavioral; then
            echo "::error::Generated files are stale. Run the scripts/build_*.py generators and commit."
            git --no-pager diff --stat -- cheatsheet docs detections.json behavioral-keys.yml dist/behavioral
            exit 1
          fi
