title: AWS S3 Object Retrieval
id: a68b407c-3706-4afa-b0e2-84824a09489d
status: experimental
description: Detects S3 GetObject (a data event). Individually normal; mass retrieval by one principal indicates data staging/collection. Requires S3 data events to be enabled; apply thresholds and scope to sensitive buckets.
references:
- https://attack.mitre.org/techniques/T1530/
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
tags:
- attack.collection
- attack.t1530
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: GetObject
    eventSource: s3.amazonaws.com
  condition: selection
falsepositives:
- Applications and users reading objects routinely. Baseline per principal/bucket.
level: low
