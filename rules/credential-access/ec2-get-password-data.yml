title: AWS EC2 Windows Password Data Retrieved
id: 2a8b446c-2c6a-493d-a82c-f2072fc6d45b
status: experimental
description: Detects retrieval of the encrypted local Administrator password for a Windows EC2 instance (GetPasswordData). Used to obtain credentials for RDP/lateral movement.
references:
- https://attack.mitre.org/techniques/T1552/
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
tags:
- attack.credential-access
- attack.t1552
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: GetPasswordData
    eventSource: ec2.amazonaws.com
  condition: selection
falsepositives:
- Provisioning workflows that retrieve the initial Windows password.
level: medium
