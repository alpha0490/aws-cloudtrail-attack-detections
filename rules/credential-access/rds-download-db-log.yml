title: AWS RDS Database Log Downloaded
id: a1765bf2-b34e-49cc-a141-c53af3f03cc0
status: experimental
description: Detects downloading of RDS database log files (DownloadDBLogFilePortion/DownloadCompleteDBLogFile), which may contain credentials or sensitive query data.
references:
- https://attack.mitre.org/techniques/T1552/
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
tags:
- attack.credential-access
- attack.t1552
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName:
    - DownloadDBLogFilePortion
    - DownloadCompleteDBLogFile
    eventSource: rds.amazonaws.com
  condition: selection
falsepositives:
- DBAs/tooling retrieving logs for troubleshooting.
level: low
tier: hunt
