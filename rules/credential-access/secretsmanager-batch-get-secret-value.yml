title: AWS Secrets Manager Batch Secret Retrieval
id: dc4d6083-5dc7-46ba-afe3-bf67ca99a803
status: experimental
description: Detects BatchGetSecretValue, which returns multiple secrets in one call - an efficient credential-harvesting primitive.
references:
- https://attack.mitre.org/techniques/T1555/006/
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
tags:
- attack.credential-access
- attack.t1555.006
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: BatchGetSecretValue
    eventSource: secretsmanager.amazonaws.com
  condition: selection
falsepositives:
- Tooling that legitimately reads many secrets at once.
level: medium
