title: AWS Secrets Manager Secret Retrieved
id: fd5c2cba-ac28-4270-85e3-855b941cf0df
status: experimental
description: Detects retrieval of a secret value (GetSecretValue). Single calls are normal; bulk retrieval across many secrets by one principal indicates credential harvesting - apply a threshold/correlation in your SIEM.
references:
- https://attack.mitre.org/techniques/T1555/006/
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
tags:
- attack.credential-access
- attack.t1555.006
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: GetSecretValue
    eventSource: secretsmanager.amazonaws.com
  condition: selection
falsepositives:
- Applications and pipelines reading secrets at runtime. Baseline per principal.
level: medium
tier: hunt
