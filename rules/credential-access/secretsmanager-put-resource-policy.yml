title: AWS Secrets Manager Resource Policy Modified
id: d097b138-9bcc-43ff-9b5b-2493ead12bdb
status: experimental
description: Detects changes to a secret's resource policy (PutResourcePolicy). Granting GetSecretValue to an external account or '*' backdoors access to the secret. Inspect requestParameters.resourcePolicy.
references:
- https://attack.mitre.org/techniques/T1098/
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
tags:
- attack.credential-access
- attack.t1098
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: PutResourcePolicy
    eventSource: secretsmanager.amazonaws.com
  condition: selection
falsepositives:
- Legitimate cross-account secret sharing (allowlist known accounts).
level: high
tier: alert
