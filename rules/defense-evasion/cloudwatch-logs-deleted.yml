title: AWS CloudWatch Log Group or Stream Deleted
id: 9f41657d-f7eb-4b67-8859-817eaaca1273
status: experimental
description: Detects deletion of CloudWatch Logs groups or streams (DeleteLogGroup/DeleteLogStream), destroying application/audit logs.
references:
- https://attack.mitre.org/techniques/T1562/008/
- https://attack.mitre.org/techniques/T1070/
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
tags:
- attack.defense-evasion
- attack.t1562.008
- attack.t1070
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName:
    - DeleteLogGroup
    - DeleteLogStream
    eventSource: logs.amazonaws.com
  condition: selection
falsepositives:
- Lifecycle management of log groups.
level: medium
tier: hunt
