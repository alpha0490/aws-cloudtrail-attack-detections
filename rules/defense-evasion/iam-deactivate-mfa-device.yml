title: AWS MFA Device Deactivated
id: b5f30eed-804f-4535-85bd-47ca8c016f87
status: experimental
description: Detects deactivation of an MFA device (DeactivateMFADevice). Removing MFA weakens authentication and can lock out or impersonate the victim; high-signal against another user.
references:
- https://attack.mitre.org/techniques/T1556/006/
- https://attack.mitre.org/techniques/T1531/
- https://docs.aws.amazon.com/IAM/latest/APIReference/API_DeactivateMFADevice.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
tags:
- attack.defense-evasion
- attack.t1556.006
- attack.t1531
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: DeactivateMFADevice
    eventSource: iam.amazonaws.com
  condition: selection
falsepositives:
- Legitimate MFA device replacement/offboarding.
level: high
tier: alert
