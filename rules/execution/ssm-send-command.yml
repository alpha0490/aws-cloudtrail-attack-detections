title: AWS SSM SendCommand Execution on EC2
id: f4401d3c-2655-4cbe-8497-fea9f5cefeae
status: experimental
description: Detects use of SSM SendCommand, which runs commands on managed EC2 instances (remote code execution path). Attackers use this for execution and lateral movement. Exclude legitimate automation/service principals.
references:
- https://attack.mitre.org/techniques/T1651/
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
tags:
- attack.execution
- attack.t1651
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: SendCommand
    eventSource: ssm.amazonaws.com
  condition: selection
falsepositives:
- Patch/automation pipelines and the AWS SSM service role. Allowlist known automation principals.
level: medium
