title: AWS EBS Snapshot Shared Externally
id: 53475ccd-69c4-4387-bd76-f9984997b57c
status: experimental
description: Detects modification of EBS snapshot permissions (ModifySnapshotAttribute). Sharing a snapshot with another AWS account or making it public lets an attacker restore the disk elsewhere. Inspect requestParameters.createVolumePermission for group=all (public) or a foreign account ID. (Correct API name is ModifySnapshotAttribute, not 'ModifySnapshotAttributes'.)
references:
- https://attack.mitre.org/techniques/T1537/
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
tags:
- attack.exfiltration
- attack.t1537
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: ModifySnapshotAttribute
    eventSource: ec2.amazonaws.com
  condition: selection
falsepositives:
- Legitimate sharing of snapshots with known partner accounts (allowlist account IDs).
level: high
