title: AWS EC2 Large/GPU Instance Launched (Possible Cryptomining)
id: eec16484-dfd4-4314-990a-18918f97fb7d
status: experimental
description: Detects launching of large or GPU EC2 instance types frequently abused for cryptomining (RunInstances with p/g/x/large families). Heuristic - tune the instance-type prefixes and counts to your environment.
references:
- https://attack.mitre.org/techniques/T1496/
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
tags:
- attack.impact
- attack.t1496
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: RunInstances
    eventSource: ec2.amazonaws.com
    requestParameters.instanceType|startswith:
    - p2
    - p3
    - p4
    - p5
    - g3
    - g4
    - g5
    - g6
    - x1
    - x2
    - inf1
    - inf2
    - trn1
    - dl1
  condition: selection
falsepositives:
- Legitimate ML/HPC/big-data workloads using GPU or large instances. Allowlist expected types/accounts.
level: medium
tier: hunt
