title: AWS S3 Object Deletion
id: 08e4eaa6-fcc2-49a7-a46c-8c2a5c5a8b0d
status: experimental
description: Detects deletion of S3 objects (DeleteObject/DeleteObjects), a data event. Mass deletion indicates destruction or ransomware. Requires S3 data events; apply thresholds.
references:
- https://attack.mitre.org/techniques/T1485/
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
tags:
- attack.impact
- attack.t1485
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName:
    - DeleteObject
    - DeleteObjects
    eventSource: s3.amazonaws.com
  condition: selection
falsepositives:
- Lifecycle and application cleanup. Baseline per principal/bucket.
level: medium
