title: AWS Organizations Handshake Accepted
id: d72935c2-cd86-4cfa-964b-451573d2e7f0
status: experimental
description: Detects acceptance of an AWS Organizations handshake (AcceptHandshake), e.g. joining/inviting an account. Abuse can establish a trusted relationship for cross-account access.
references:
- https://attack.mitre.org/techniques/T1199/
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
tags:
- attack.initial-access
- attack.t1199
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: AcceptHandshake
    eventSource: organizations.amazonaws.com
  condition: selection
falsepositives:
- Planned organization changes by cloud/platform teams.
level: medium
tier: hunt
