title: AWS Management Console Login
id: 2387303a-138f-4f96-b92b-544a8e3dae7d
status: experimental
description: Detects an interactive sign-in to the AWS Management Console. Useful as a building block and for baselining who logs in, from where, and when. Tune with geolocation/known-IP allowlists.
references:
- https://attack.mitre.org/techniques/T1078/004/
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
tags:
- attack.initial-access
- attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: ConsoleLogin
    eventSource: signin.amazonaws.com
    responseElements.ConsoleLogin: Success
  condition: selection
falsepositives:
- Routine user and administrator console logins are expected. Baseline per principal and source IP/geo.
level: low
tier: hunt
