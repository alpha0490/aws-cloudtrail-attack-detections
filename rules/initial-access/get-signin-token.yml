title: AWS Federation GetSigninToken
id: 32880b51-9689-4c61-87b4-e710b0bc531b
status: experimental
description: Detects use of GetSigninToken, which exchanges temporary credentials for a console sign-in token (federated console access). Attackers with stolen temporary credentials can use this to pivot into the console.
references:
- https://attack.mitre.org/techniques/T1550/001/
- https://attack.mitre.org/techniques/T1078/004/
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
tags:
- attack.initial-access
- attack.t1550.001
- attack.t1078.004
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: GetSigninToken
    eventSource: signin.amazonaws.com
  condition: selection
falsepositives:
- Legitimate SSO/federation brokers and identity tooling.
level: medium
