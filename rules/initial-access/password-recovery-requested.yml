title: AWS Console Password Recovery Requested
id: a1e1a9fd-1eb5-40bd-aaa8-ab8f8108d3fe
status: experimental
description: Detects a request to recover/reset an AWS console password (PasswordRecoveryRequested). Attackers may trigger password recovery as part of account takeover.
references:
- https://attack.mitre.org/techniques/T1078/004/
- https://attack.mitre.org/techniques/T1098/
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
tags:
- attack.initial-access
- attack.t1078.004
- attack.t1098
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: PasswordRecoveryRequested
    eventSource: signin.amazonaws.com
  condition: selection
falsepositives:
- Legitimate users who forgot their password.
level: medium
