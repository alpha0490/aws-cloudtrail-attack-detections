title: AWS Console Login Password Spray From Single Source IP
id: 6100b771-fa7b-43fd-aafe-23b22093b01a
status: experimental
description: Detects a single source IP generating failed console logins for 3 or more distinct usernames within 1 hour, indicating password spraying.
references:
- https://attack.mitre.org/techniques/T1110/003/
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
correlation:
  type: value_count
  rules:
  - aws_console_login_failure_spray
  group-by:
  - sourceIPAddress
  timespan: 1h
  condition:
    gte: 3
    field: userIdentity.userName
tags:
- attack.initial-access
- attack.credential-access
- attack.t1110.003
level: high
