title: AWS IAM Service-Specific Credential Created
id: 5130a9d7-7267-424c-975e-78b0f64cf725
status: experimental
description: Detects creation of service-specific credentials (CreateServiceSpecificCredential), e.g. for CodeCommit. These are an alternative long-lived credential an attacker can plant for persistence.
references:
- https://attack.mitre.org/techniques/T1098/001/
- https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateServiceSpecificCredential.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
tags:
- attack.persistence
- attack.t1098.001
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: CreateServiceSpecificCredential
    eventSource: iam.amazonaws.com
  condition: selection
falsepositives:
- Developers provisioning CodeCommit/HTTPS Git credentials.
level: medium
