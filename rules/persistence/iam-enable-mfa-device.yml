title: AWS MFA Device Enabled for User
id: eec85cd3-45ad-4ca2-9069-cf48fc23c1d0
status: experimental
description: Detects enabling an MFA device for an IAM user (EnableMFADevice). High-signal when an attacker enrolls their own MFA device onto a compromised account; verify the target user vs the caller.
references:
- https://attack.mitre.org/techniques/T1556/006/
- https://docs.aws.amazon.com/IAM/latest/APIReference/API_EnableMFADevice.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
tags:
- attack.persistence
- attack.t1556.006
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: EnableMFADevice
    eventSource: iam.amazonaws.com
  condition: selection
falsepositives:
- Legitimate MFA enrollment during onboarding.
level: medium
