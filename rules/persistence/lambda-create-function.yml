title: AWS Lambda Function Created
id: de63c760-7d3d-47d8-8f3f-2cb8ad140582
status: experimental
description: Detects creation of a Lambda function (logged as CreateFunction20150331). Attackers deploy functions as backdoors or to trigger on events. Note the versioned eventName used by the Lambda API.
references:
- https://attack.mitre.org/techniques/T1098/
- https://attack.mitre.org/techniques/T1648/
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
tags:
- attack.persistence
- attack.t1098
- attack.t1648
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName:
    - CreateFunction20150331
    - CreateFunction
    eventSource: lambda.amazonaws.com
  condition: selection
falsepositives:
- Normal application/IaC deployments of functions.
level: low
