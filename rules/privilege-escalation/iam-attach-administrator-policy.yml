title: AWS IAM Privileged/Admin Managed Policy Attached
id: 76a8a573-05c1-4e77-9b98-b797f149a7c3
status: experimental
description: Detects attachment of an escalation-equivalent AWS managed policy (AdministratorAccess, IAMFullAccess, or PowerUserAccess) to a user, role, or group. IAMFullAccess is itself an escalation primitive - the grantee can then attach AdministratorAccess. The match also covers the AdministratorAccess-* job-function variants. Custom wildcard (Action:* Resource:*) policies are caught separately by iam-wildcard-policy-document.yml.
references:
- https://attack.mitre.org/techniques/T1098/003/
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
tags:
- attack.privilege-escalation
- attack.t1098.003
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName:
    - AttachUserPolicy
    - AttachRolePolicy
    - AttachGroupPolicy
    eventSource: iam.amazonaws.com
    requestParameters.policyArn|contains:
    - AdministratorAccess
    - IAMFullAccess
    - PowerUserAccess
  condition: selection
falsepositives:
- Deliberate, reviewed granting of privileged access (should be rare).
- PowerUserAccess can be attached routinely in dev/sandbox accounts - tune or drop it there.
level: high
tier: alert
