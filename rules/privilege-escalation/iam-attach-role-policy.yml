title: AWS IAM Managed Policy Attached to Role
id: 0eb922b2-f939-481c-9c0f-06d085366f45
status: experimental
description: Detects attachment of a managed policy to an IAM role (AttachRolePolicy). A common privilege-escalation step, especially when the role is assumable by the attacker.
references:
- https://attack.mitre.org/techniques/T1098/003/
- https://docs.aws.amazon.com/IAM/latest/APIReference/API_AttachRolePolicy.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
tags:
- attack.privilege-escalation
- attack.t1098.003
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: AttachRolePolicy
    eventSource: iam.amazonaws.com
  condition: selection
falsepositives:
- Routine role permission changes by platform teams.
level: medium
