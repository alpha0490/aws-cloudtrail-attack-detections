title: AWS IAM Policy Attached/Added to Group
id: 230fabc5-8a25-4b9b-8334-4caf29c44f92
status: experimental
description: Detects attaching a managed policy or adding an inline policy to an IAM group (AttachGroupPolicy/PutGroupPolicy), which escalates permissions for all members.
references:
- https://attack.mitre.org/techniques/T1098/003/
- https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
tags:
- attack.privilege-escalation
- attack.t1098.003
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName:
    - AttachGroupPolicy
    - PutGroupPolicy
    eventSource: iam.amazonaws.com
  condition: selection
falsepositives:
- Legitimate group permission management.
level: medium
tier: hunt
