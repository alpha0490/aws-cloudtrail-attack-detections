title: AWS IAM Inline Policy Added to Role
id: 3a6c0b93-dc31-49c3-9740-416868ccb22a
status: experimental
description: Detects addition of an inline policy to an IAM role (PutRolePolicy). Used to silently widen a role's permissions.
references:
- https://attack.mitre.org/techniques/T1098/003/
- https://docs.aws.amazon.com/IAM/latest/APIReference/API_PutRolePolicy.html
author: aws-cloudtrail-attack-detections contributors
date: '2026-06-05'
tags:
- attack.privilege-escalation
- attack.t1098.003
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    eventName: PutRolePolicy
    eventSource: iam.amazonaws.com
  condition: selection
falsepositives:
- Legitimate fine-grained role permission grants.
level: medium
tier: hunt
