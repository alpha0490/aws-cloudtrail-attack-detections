# --- Coverage-expansion batch (v0.2) ---

- rule: rules/defense-evasion/ec2-authorize-security-group-ingress-world.yml
  stratus: aws.exfiltration.ec2-security-group-open-port-22-ingress
  positive:
    note: SSH opened to the whole internet (0.0.0.0/0)
    event:
      eventSource: ec2.amazonaws.com
      eventName: AuthorizeSecurityGroupIngress
      requestParameters:
        ipPermissions:
          items:
            - ipProtocol: tcp
              fromPort: 22
              ipRanges:
                items:
                  - cidrIp: "0.0.0.0/0"
  negative:
    note: Ingress scoped to a private CIDR (not world-open)
    event:
      eventSource: ec2.amazonaws.com
      eventName: AuthorizeSecurityGroupIngress
      requestParameters:
        ipPermissions:
          items:
            - ipRanges:
                items:
                  - cidrIp: "10.0.0.0/8"

