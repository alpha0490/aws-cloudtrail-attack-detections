- rule: rules/privilege-escalation/iam-wildcard-policy-document.yml
  positive:
    note: Inline policy granting Action * on Resource * (custom admin)
    event:
      eventSource: iam.amazonaws.com
      eventName: PutUserPolicy
      requestParameters:
        userName: bob
        policyDocument: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"*","Resource":"*"}]}'
  negative:
    note: Scoped inline policy (specific action + resource)
    event:
      eventSource: iam.amazonaws.com
      eventName: PutUserPolicy
      requestParameters:
        userName: bob
        policyDocument: '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:GetObject","Resource":"arn:aws:s3:::my-bucket/*"}]}'
