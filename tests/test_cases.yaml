- rule: rules/privilege-escalation/iam-pass-role-to-new-resource.yml
  positive:
    note: RunInstances passing an instance profile (selection AND filter|exists)
    event:
      eventSource: ec2.amazonaws.com
      eventName: RunInstances
      requestParameters:
        instanceType: m5.large
        iamInstanceProfile: { arn: "arn:aws:iam::123456789012:instance-profile/app" }
  negative:
    note: RunInstances with NO instance profile passed
    event:
      eventSource: ec2.amazonaws.com
      eventName: RunInstances
      requestParameters: { instanceType: m5.large, imageId: ami-0abc123 }

